<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookApp – Empty State</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .empty-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 40px;
      background: var(--bg);
      gap: 20px;
    }
    .empty-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
    }
    .empty-subtitle {
      font-size: 14px;
      color: var(--text2);
      text-align: center;
      line-height: 1.6;
    }
    .empty-cta {
      height: 48px;
      border-radius: 14px;
      background: var(--accent);
      color: var(--bg);
      font-size: 15px;
      font-weight: 700;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(122,46,46,0.35);
      margin-top: 8px;
    }
    .empty-cta:hover { background: #8B3535; }
  </style>
</head>
<body>

  <div class="screen-label">S1 – Empty State (Read Tab)</div>

  <div class="phone">

    <div class="status-bar">
      <span>9:41</span>
      <span>●●● 🔋</span>
    </div>

    <div class="nav-bar">
      <div class="nav-title">My Books</div>

    </div>

    <div class="top-tabs">
      <a class="tab active" href="book-list-read.html">
        Read <span class="tab-count">0</span>
      </a>
      <a class="tab" href="book-list-wishlist.html">
        Wish List <span class="tab-count">0</span>
      </a>
    </div>

    <div class="empty-container">

      <svg width="180" height="155" viewBox="0 0 140 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="88" width="100" height="14" rx="4" fill="#1B4332"/>
        <rect x="22" y="86" width="96" height="5" rx="2" fill="#2D5A3D"/>
        <rect x="28" y="70" width="84" height="20" rx="4" fill="#7A2E2E"/>
        <rect x="30" y="68" width="80" height="5" rx="2" fill="#8B3535"/>
        <rect x="35" y="52" width="70" height="20" rx="4" fill="#C9A227"/>
        <rect x="37" y="50" width="66" height="5" rx="2" fill="#D4A830"/>
        <circle cx="70" cy="62" r="7" fill="#F7F1E6" opacity="0.9"/>
        <circle cx="67.5" cy="60.5" r="1" fill="#2B2320"/>
        <circle cx="72.5" cy="60.5" r="1" fill="#2B2320"/>
        <path d="M67 64 Q70 67 73 64" stroke="#2B2320" stroke-width="1" fill="none" stroke-linecap="round"/>
        <text x="15" y="45" font-size="12" fill="#C9A227" opacity="0.6">✦</text>
        <text x="118" y="70" font-size="10" fill="#C9A227" opacity="0.5">✦</text>
      </svg>

      <div class="empty-title">Your stack awaits</div>
      <div class="empty-subtitle">Every great shelf starts with one book. What did you read last?</div>
      <a class="empty-cta" href="#">Add a book</a>

    </div>

  </div>

  <div class="jira-badge">
    <span class="jira-tag">S1 – Empty State</span>
  </div>

</body>
</html>
