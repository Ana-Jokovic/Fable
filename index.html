<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fable – Mockups</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #D6CFC4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      gap: 48px;
    }
    header { text-align: center; }
    header h1 { font-size: 32px; font-weight: 800; color: #2B2320; margin-bottom: 8px; }
    header p { font-size: 14px; color: #8A7C6C; }
    .nav-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .nav-card {
      background: #F7F1E6;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      width: 220px;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
    }
    .nav-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.18);
    }
    .nav-card-thumb {
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
    }
    .nav-card-thumb.green  { background: #1B4332; }
    .nav-card-thumb.red    { background: #7A2E2E; }
    .nav-card-thumb.gold   { background: #C9A227; }
    .nav-card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-card-title { font-size: 16px; font-weight: 700; color: #2B2320; }
    .nav-card-desc  { font-size: 12px; color: #8A7C6C; line-height: 1.5; }
  </style>
</head>
<body>

  <header>
    <h1>📚 Fable</h1>
    <p>Design mockups & documentation</p>
  </header>

  <div class="nav-grid">

    <a class="nav-card" href="stories.html">
      <div class="nav-card-thumb green">🗂️</div>
      <div class="nav-card-body">
        <div class="nav-card-title">Mockups per Story</div>
        <div class="nav-card-desc">One screen per user story with acceptance criteria.</div>
      </div>
    </a>

    <a class="nav-card" href="final-mockups.html">
      <div class="nav-card-thumb red">📱</div>
      <div class="nav-card-body">
        <div class="nav-card-title">Final Mockups</div>
        <div class="nav-card-desc">All final screens — book list, detail, forms and sheets.</div>
      </div>
    </a>

    <a class="nav-card" href="color-palette.html">
      <div class="nav-card-thumb gold">🎨</div>
      <div class="nav-card-body">
        <div class="nav-card-title">Color Palette</div>
        <div class="nav-card-desc">App color tokens with hex values and usage notes.</div>
      </div>
    </a>

  </div>

</body>
</html>
