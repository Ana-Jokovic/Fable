<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookApp – Sort Sheet</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .dimmed-bg {
      flex: 1;
      background: rgba(43,35,32,0.4);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .sheet {
      background: var(--bg);
      border-radius: 24px 24px 0 0;
      padding: 0 0 24px;
    }
    .sheet-handle {
      width: 36px; height: 4px;
      border-radius: 2px; background: var(--border);
      align-self: center; margin: 12px auto 4px;
      display: block;
    }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }
    .sheet-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .sheet-close { font-size: 20px; color: var(--text2); cursor: pointer; text-decoration: none; }
    .sort-list { padding: 8px 0; }
    .sort-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .sort-row:last-child { border-bottom: none; }
    .sort-row.active { background: rgba(122,46,46,0.04); }
    .sort-left { display: flex; flex-direction: column; gap: 2px; }
    .sort-name { font-size: 15px; color: var(--text); font-weight: 500; }
    .sort-name.active { font-weight: 700; color: var(--accent); }
    .sort-dir { font-size: 11px; color: var(--text2); }
    .sort-right { display: flex; align-items: center; gap: 8px; }
    .sort-check { font-size: 20px; color: var(--accent); }
    .dir-toggle {
      display: flex; border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border);
    }
    .dir-btn {
      width: 32px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; cursor: pointer;
      background: var(--surface); color: var(--text2);
    }
    .dir-btn.active { background: var(--accent); color: var(--bg); }

    /* Background peek */
    .bg-peek { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .peek-card {
      border-radius: 12px; padding: 10px 12px;
      display: flex; gap: 10px; align-items: center;
      background: var(--surface); border: 1px solid var(--border); opacity: 0.5;
    }
    .peek-cover { width: 36px; height: 52px; border-radius: 5px; background: var(--nav); flex-shrink: 0; }
    .peek-lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .peek-line { height: 8px; border-radius: 4px; background: var(--border); }
  </style>
</head>
<body>

  <div class="screen-label">S16 – Sort Sheet</div>

  <div class="phone">

    <div class="status-bar">
      <span>9:41</span>
      <span>●●● 🔋</span>
    </div>

    <div class="nav-bar">
      <div class="nav-title">My Books</div>
      <div class="nav-icons">
        <span class="nav-icon" style="color:var(--gold);">⇅</span>
        <a class="nav-icon" href="filter-sheet.html">⊟</a>
      </div>
    </div>

    <div class="dimmed-bg">

      <div class="bg-peek">
        <div class="peek-card">
          <div class="peek-cover"></div>
          <div class="peek-lines">
            <div class="peek-line" style="width:70%"></div>
            <div class="peek-line" style="width:50%"></div>
            <div class="peek-line" style="width:40%"></div>
          </div>
        </div>
        <div class="peek-card">
          <div class="peek-cover"></div>
          <div class="peek-lines">
            <div class="peek-line" style="width:60%"></div>
            <div class="peek-line" style="width:45%"></div>
            <div class="peek-line" style="width:35%"></div>
          </div>
        </div>
      </div>

      <div class="sheet">
        <span class="sheet-handle"></span>

        <div class="sheet-header">
          <div class="sheet-title">Sort By</div>
          <a class="sheet-close" href="book-list-read.html">✕</a>
        </div>

        <div class="sort-list">

          <div class="sort-row active">
            <div class="sort-left">
              <div class="sort-name active">Rating</div>
              <div class="sort-dir">Highest first</div>
            </div>
            <div class="sort-right">
              <div class="dir-toggle">
                <div class="dir-btn active">↓</div>
                <div class="dir-btn">↑</div>
              </div>
              <span class="sort-check">✓</span>
            </div>
          </div>

          <div class="sort-row">
            <div class="sort-left">
              <div class="sort-name">Title</div>
              <div class="sort-dir">A → Z</div>
            </div>
            <div class="sort-right">
              <div class="dir-toggle">
                <div class="dir-btn active">↑</div>
                <div class="dir-btn">↓</div>
              </div>
            </div>
          </div>

          <div class="sort-row">
            <div class="sort-left">
              <div class="sort-name">Date Read</div>
              <div class="sort-dir">Most recent first</div>
            </div>
            <div class="sort-right">
              <div class="dir-toggle">
                <div class="dir-btn active">↓</div>
                <div class="dir-btn">↑</div>
              </div>
            </div>
          </div>

          <div class="sort-row">
            <div class="sort-left">
              <div class="sort-name">Published Date</div>
              <div class="sort-dir">Newest first</div>
            </div>
            <div class="sort-right">
              <div class="dir-toggle">
                <div class="dir-btn active">↓</div>
                <div class="dir-btn">↑</div>
              </div>
            </div>
          </div>

          <div class="sort-row">
            <div class="sort-left">
              <div class="sort-name">Page Count</div>
              <div class="sort-dir">Longest first</div>
            </div>
            <div class="sort-right">
              <div class="dir-toggle">
                <div class="dir-btn active">↓</div>
                <div class="dir-btn">↑</div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>

  <div class="jira-badge">
    <span class="jira-tag">S16 – Sort List</span>
  </div>

</body>
</html>
